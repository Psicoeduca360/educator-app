<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crea cursos y contenidos con Canva</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1c1a3a;--mut:#5d5a7a;--line:#e3e0f2;--v:#6a3df0;--vsoft:#ece6ff;--t:#0fb5a4;--tsoft:#d9f5f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13122a;--card:#1d1b3d;--ink:#f0eefc;--mut:#b0acd0;--line:#33305c;--v:#8b68ff;--vsoft:#2e2668;--tsoft:#123a36}}
:root[data-theme="dark"]{--bg:#13122a;--card:#1d1b3d;--ink:#f0eefc;--mut:#b0acd0;--line:#33305c;--v:#8b68ff;--vsoft:#2e2668;--tsoft:#123a36}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;line-height:1.1;margin:0 0 12px}
h1{font-size:clamp(34px,6vw,58px);font-weight:800}h2{font-size:clamp(24px,4vw,32px)}h3{font-size:19px}
button{font:inherit;cursor:pointer;color:inherit}:focus-visible{outline:3px solid var(--t);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:10px 20px;flex-wrap:wrap}
.brand{font:800 18px 'Bricolage Grotesque',system-ui,sans-serif;background:none;border:0;padding:0}
.prog{flex:1;min-width:150px;font-size:13px;color:var(--mut)}
.track{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:3px}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--t));transition:width .4s}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:start}
.play{display:grid;grid-template-columns:290px 1fr;gap:28px}
@media(max-width:800px){.hero,.play{grid-template-columns:1fr}.side{order:2}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.btn{background:var(--v);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.lead{color:var(--mut);font-size:19px;max-width:560px}
.facts{list-style:none;padding:0;margin:0 0 18px}.facts li{padding:8px 0;border-bottom:1px solid var(--line)}
.learn{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0;list-style:none}
@media(max-width:600px){.learn{grid-template-columns:1fr}}
.learn li{background:var(--tsoft);border-radius:10px;padding:12px 14px}
.mod{margin-bottom:14px}.mod b{display:block;font-size:15px;margin-bottom:4px}
.it{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:8px;font-size:15px;color:var(--mut)}
.it.on{background:var(--vsoft);color:var(--ink);font-weight:700}
.ck{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:4px;font-size:11px;text-align:center;line-height:14px}
.ck.d{background:var(--t);border-color:var(--t);color:#04332d}
.meta{color:var(--mut);font-size:14px}
ol.st{padding-left:22px}ol.st li{margin-bottom:10px}
.tip{background:var(--tsoft);border-radius:12px;padding:14px 16px;margin:20px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.opt.ok{border-color:var(--t)}.opt.no{border-color:#e5484d}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:380px;margin:8px 0 20px}
.cert{border:3px double var(--v);border-radius:6px;padding:44px 20px;text-align:center;background:var(--card)}
.cert h2{font-size:clamp(28px,6vw,44px);color:var(--v)}
</style></head><body>
<header><button class="brand" onclick="S.v='home';render()">Canva para cursos</button>
<div class="prog"><span id="pct"></span><div class="track"><div id="bar"></div></div></div>
<button class="btn g" onclick="S.v='cert';render()">Certificado</button></header>
<main class="wrap" id="app"></main>
<script>
const M=[
{t:"Primeros pasos",l:[
["El ecosistema de Canva",6,"Canva reúne diseño, presentaciones, documentos y video en un solo lugar: todo lo que necesita un curso.",["Explora el Inicio y busca «Presentaciones» y «Documentos».","Abre Plantillas y filtra por Educación.","Guarda 3 plantillas que te inspiren en una carpeta."],"La versión gratuita alcanza para casi todo este curso."],
["Tipos de contenido para un curso",7,"Un curso combina formatos distintos: cada uno cumple una función de aprendizaje.",["Presentaciones: explican conceptos.","Workbooks en PDF: permiten practicar.","Infografías y carruseles: resumen y refuerzan."],"Mezcla al menos dos formatos por módulo para mantener la atención."],
["Configura tu cuenta y espacio",5,"Un espacio ordenado desde el inicio te ahorra horas después.",["Crea una carpeta llamada como tu curso.","Dentro, una subcarpeta por módulo.","Nombra los diseños así: M1-L2-Presentación."],"Usa el mismo esquema de nombres en todo el curso."]],
q:{q:"¿Qué formato sirve mejor para que el estudiante practique por escrito?",o:["Una infografía","Un workbook en PDF","Una portada"],a:1,e:"El workbook tiene espacios para completar y practicar."}},
{t:"Diseña la estructura",l:[
["Define el objetivo de aprendizaje",8,"Todo el curso se construye desde una pregunta: ¿qué sabrá hacer tu estudiante al terminar?",["Escribe el objetivo con un verbo medible: «Diseñarás…».","Define quién es tu estudiante y su nivel.","Anota el resultado final que podrá mostrar."],"Si no puedes medirlo, reescribe el verbo."],
["Arma el temario en módulos",8,"Divide el objetivo en 4 o 5 bloques que avancen de lo simple a lo complejo.",["Lista todo lo que hay que aprender.","Agrupa por temas afines.","Ordena de menor a mayor dificultad."],"Módulos cortos se terminan; los largos se abandonan."],
["Planifica cada lección",7,"Cada lección necesita una estructura repetible que puedas producir rápido.",["Define: objetivo, explicación, ejemplo, práctica.","Limita cada lección a una sola idea.","Calcula entre 5 y 10 minutos por lección."],"Crea una plantilla de guion y úsala siempre."]],
q:{q:"Un buen objetivo de aprendizaje empieza con…",o:["Un verbo medible","Un tema general","El nombre de la herramienta"],a:0,e:"Un verbo medible (diseñar, crear, aplicar) permite comprobar el aprendizaje."}},
{t:"Identidad visual",l:[
["Crea tu Kit de marca",7,"El Kit de marca guarda colores, fuentes y logos para reutilizarlos con un clic.",["Abre Kit de marca en el menú de Canva.","Sube tu logo (o crea uno simple).","Guarda colores y fuentes principales."],"Es una función de pago; si no la tienes, guarda tus códigos de color en una nota."],
["Elige colores y tipografías",8,"Pocos elementos, bien usados, hacen que tu curso se vea profesional.",["Elige 1 color principal, 1 de apoyo y neutros.","Usa 2 tipografías: una para títulos, otra para texto.","Verifica que el texto se lea bien sobre el fondo."],"Prefiere contraste alto: se lee mejor en el celular."],
["Convierte tus diseños en plantillas",6,"Una plantilla propia acelera cada lección nueva.",["Diseña una lección modelo con tu marca.","Duplícala y bórrale el contenido.","Guárdala como plantilla o cópiala en cada módulo."],"Diseña una portada, una diapositiva de contenido y una de cierre."]],
q:{q:"¿Cuántas tipografías se recomienda usar en un curso?",o:["Dos: títulos y texto","Seis o más","Una distinta por página"],a:0,e:"Dos tipografías dan orden y coherencia visual."}},
{t:"Crea tus contenidos",l:[
["Presentaciones que enseñan",9,"Una diapositiva didáctica comunica una idea, no un párrafo.",["Un título que diga la idea principal.","Máximo 30 palabras por diapositiva.","Apóyate en una imagen, esquema o ejemplo."],"Si necesitas leer la diapositiva, tiene demasiado texto."],
["Workbooks y guías en PDF",9,"El workbook convierte la teoría en práctica y da algo tangible al estudiante.",["Crea un Documento de tamaño A4 o Carta.","Incluye espacios de respuesta y listas de verificación.","Añade una página de resumen al final."],"Los enlaces clicables funcionan al exportar a PDF."],
["Infografías y carruseles",8,"Ideales para resumir un módulo y compartirlo en redes.",["Elige la idea clave del módulo.","Divídela en 5 pasos o puntos.","Usa iconos y colores de tu marca."],"Un carrusel de 6 a 8 páginas funciona bien."]],
q:{q:"Para una diapositiva didáctica lo ideal es…",o:["Una idea principal","Todo el texto de la lección","Muchas animaciones"],a:0,e:"Una idea por diapositiva ayuda a recordar."}},
{t:"Publica y comparte",l:[
["Exporta en el formato correcto",6,"El formato depende del uso: cada uno tiene su función.",["PDF estándar para leer en pantalla.","PDF para imprimir para materiales físicos.","PNG o JPG para redes; MP4 para video."],"Descarga solo las páginas que necesitas."],
["Graba y edita tus videos",9,"Un video corto con tu voz sobre las diapositivas humaniza el curso.",["Usa Presentar y grabar en Canva.","Graba en un lugar silencioso.","Recorta pausas con el editor de video."],"Videos de 3 a 6 minutos retienen más."],
["Publica y promociona tu curso",8,"Tus materiales listos, ahora toca ponerlos donde tus estudiantes puedan verlos.",["Elige dónde alojarlo: plataforma de cursos, Drive o sitio web.","Crea una portada y 3 piezas para redes.","Pide comentarios a los primeros 5 estudiantes."],"Publica pronto y mejora con lo que te digan."]],
q:{q:"¿Qué formato exportas para una guía que se imprimirá?",o:["PDF para imprimir","GIF","MP4"],a:0,e:"PDF para imprimir conserva la calidad y los márgenes."}}
];
const total=20,$=id=>document.getElementById(id),esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let S={v:'home',m:0,l:0,q:null},D={};
try{D=JSON.parse(localStorage.getItem('cc')||'{}')}catch(e){}
D.l=D.l||{};D.q=D.q||{};D.n=D.n||'';
const save=()=>{try{localStorage.setItem('cc',JSON.stringify(D))}catch(e){}};
const count=()=>Object.keys(D.l).length+Object.keys(D.q).length;
const seq=[];M.forEach((x,m)=>{x.l.forEach((_,l)=>seq.push([m,l]));seq.push([m,-1])});
const done=s=>s[1]<0?D.q[s[0]]:D.l[s[0]+'-'+s[1]];
const pos=()=>seq.findIndex(s=>s[0]==S.m&&s[1]==S.l);
function go(m,l){S.v=l<0?'quiz':'lesson';S.m=m;S.l=l;S.q=null;render()}
function nav(i){if(i<0)i=0;if(i>=seq.length){S.v='cert';render()}else go(seq[i][0],seq[i][1])}
function start(){const i=seq.findIndex(s=>!done(s));nav(i<0?seq.length:i)}
function fin(){D.l[S.m+'-'+S.l]=1;save();nav(pos()+1)}
function pick(i){S.q=i;if(i==M[S.m].q.a){D.q[S.m]=1;save()}render(1)}
function home(){return`<div class="hero"><div><h1>Crea cursos y contenidos con Canva</h1>
<p class="lead">Aprende a diseñar, producir y publicar tu propio curso digital, paso a paso y sin experiencia previa en diseño.</p>
<button class="btn" onclick="start()">${count()?'Continuar curso':'Comenzar curso'}</button></div>
<div class="card"><ul class="facts"><li>5 módulos y 15 lecciones</li><li>Unas 2 horas en total</li><li>Nivel principiante</li><li>Con quiz por módulo y certificado</li></ul><span class="meta">Tu progreso se guarda en este navegador.</span></div></div>
<h2 style="margin-top:44px">Qué aprenderás</h2><ul class="learn"><li>Definir objetivos y estructurar un curso</li><li>Crear una identidad visual coherente</li><li>Diseñar presentaciones, workbooks e infografías</li><li>Exportar, grabar y publicar tu curso</li></ul>
<h2 style="margin-top:36px">Temario</h2>${M.map((x,i)=>`<div class="card" style="margin-bottom:12px"><h3>Módulo ${i+1}: ${x.t}</h3>${x.l.map((y,j)=>`<div class="meta">${y[0]} (${y[1]} min)</div>`).join('')}<div class="meta">Quiz del módulo</div></div>`).join('')}`}
function side(){return`<nav class="side" aria-label="Temario">${M.map((x,m)=>`<div class="mod"><b>${m+1}. ${x.t}</b>${x.l.map((y,l)=>it(m,l,y[0])).join('')}${it(m,-1,'Quiz del módulo')}</div>`).join('')}</nav>`}
function it(m,l,t){return`<button class="it ${S.m==m&&S.l==l&&S.v!='home'?'on':''}" onclick="go(${m},${l})"><span class="ck ${done([m,l])?'d':''}">${done([m,l])?'✓':''}</span>${t}</button>`}
function player(){let c;const p=pos();
if(S.v=='lesson'){const y=M[S.m].l[S.l];c=`<div class="meta">Módulo ${S.m+1} · ${y[1]} min</div><h2>${y[0]}</h2><p>${y[2]}</p><ol class="st">${y[3].map(s=>`<li>${s}</li>`).join('')}</ol><div class="tip"><b>Consejo:</b> ${y[4]}</div>
<div class="row">${p>0?`<button class="btn g" onclick="nav(${p-1})">Anterior</button>`:''}<button class="btn" onclick="fin()">${done(seq[p])?'Continuar':'Completar y continuar'}</button></div>`}
else{const Q=M[S.m].q,a=S.q!=null;c=`<div class="meta">Módulo ${S.m+1}</div><h2>Quiz del módulo</h2><p>${Q.q}</p>${Q.o.map((o,i)=>`<button class="opt ${a?(i==Q.a?'ok':i==S.q?'no':''):''}" ${a?'disabled':''} onclick="pick(${i})">${o}</button>`).join('')}
${a?`<p><b>${S.q==Q.a?'¡Correcto!':'Casi.'}</b> ${Q.e}</p>`:''}
<div class="row">${a&&S.q!=Q.a?`<button class="btn" onclick="S.q=null;render(1)">Intentar de nuevo</button>`:''}${D.q[S.m]?`<button class="btn" onclick="nav(${p+1})">Continuar</button>`:''}</div>`}
return`<div class="play">${side()}<article class="card">${c}</article></div>`}
function cert(){if(count()<total)return`<div class="card"><h2>Certificado bloqueado</h2><p>Completa las 15 lecciones y los 5 quizzes para desbloquearlo. Llevas ${count()} de ${total}.</p><button class="btn" onclick="start()">Seguir aprendiendo</button></div>`;
return`<h2>¡Terminaste el curso!</h2><label for="nm">Escribe tu nombre para tu certificado</label><br><input id="nm" value="${esc(D.n)}" oninput="D.n=this.value;save();$('cn').textContent=this.value||'Tu nombre'">
<div class="cert"><p class="meta">Certificado de finalización</p><h2 id="cn">${esc(D.n)||'Tu nombre'}</h2><p>completó con éxito el curso<br><b>Crea cursos y contenidos con Canva</b></p><p class="meta">${new Date().toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})}</p></div><p class="meta">Guarda una captura de pantalla para compartirlo.</p>`}
function render(ns){const p=Math.round(count()/total*100);$('bar').style.width=p+'%';$('pct').textContent=p+'% completado';
$('app').innerHTML=S.v=='home'?home():S.v=='cert'?cert():player();if(!ns)window.scrollTo(0,0)}
render();
</script></body></html>
